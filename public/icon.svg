<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11131e" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="paneGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1c28" />
      <stop offset="100%" stop-color="#0d0e14" />
    </linearGradient>
    <linearGradient id="brainStroke" x1="100" y1="120" x2="412" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="brainFill" x1="120" y1="140" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="coreAura" cx="256" cy="272" r="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Bold System Pane Window -->
  <rect x="40" y="40" width="432" height="432" rx="78" fill="url(#paneGrad)" stroke="#3f3f46" stroke-width="6" />

  <!-- Intricate Neural System Grid -->
  <g stroke="#2e3142" stroke-width="2.5">
    <line x1="118" y1="108" x2="118" y2="432" />
    <line x1="187" y1="108" x2="187" y2="432" />
    <line x1="256" y1="108" x2="256" y2="432" />
    <line x1="325" y1="108" x2="325" y2="432" />
    <line x1="394" y1="108" x2="394" y2="432" />
    <line x1="72" y1="164" x2="440" y2="164" />
    <line x1="72" y1="224" x2="440" y2="224" />
    <line x1="72" y1="284" x2="440" y2="284" />
    <line x1="72" y1="344" x2="440" y2="344" />
    <line x1="72" y1="404" x2="440" y2="404" />
  </g>

  <!-- System Pane Header Bar -->
  <line x1="42" y1="104" x2="470" y2="104" stroke="#3f3f46" stroke-width="4" />
  <circle cx="88" cy="73" r="8" fill="#38bdf8" />
  <circle cx="116" cy="73" r="8" fill="#818cf8" />
  <circle cx="144" cy="73" r="8" fill="#34d399" />
  <rect x="196" y="66" width="128" height="14" rx="7" fill="#27272a" />

